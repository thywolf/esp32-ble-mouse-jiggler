; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:az-delivery-devkit-v4]
; espressif32 is pinned on purpose: the BLE-stack facts in AGENTS.md were verified
; against 6.3.2 (which ships arduino-esp32 2.0.9). Bump deliberately and re-verify.
platform = espressif32@6.3.2
board = az-delivery-devkit-v4
framework = arduino
; ESP32 BLE Mouse is vendored in lib/BleMouse (fork of t-vk/ESP32-BLE-Mouse 0.3.1
; with multi-host connection support)
lib_deps = 
	philj404/SimpleSerialShell@^1.0.0
; 921600 is the ESP32 ROM bootloader's max reliable speed (2x the board
; manifest's 460800 default); drop to 460800 if flashing errors on a weak
; USB-UART chip or cable
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = huge_app.csv